  postgres:
    container_name: tvshow-api-db
    image: postgres:16-alpine
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tvshow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - tvshow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tvshow}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  tvshow-composer-cache:
  tvshow-db-data:
