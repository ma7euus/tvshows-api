services:
  app:
    container_name: tvshow-api-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_UID: ${DOCKER_UID:-1000}
        DOCKER_GID: ${DOCKER_GID:-1000}
    working_dir: /app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    init: true
    ports:
      - "${APP_PORT:-9012}:8000"
    volumes:
      - ./:/app
      - tvshow-composer-cache:/tmp/composer/cache
    environment:
      RUN_COMPOSER_INSTALL: ${RUN_COMPOSER_INSTALL:-true}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      GENERATE_SWAGGER: ${GENERATE_SWAGGER:-true}
      DB_WAIT_RETRIES: ${DB_WAIT_RETRIES:-30}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

